<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OuchiTaiko</title>
  <meta name="description" content="OuchiTaiko build guide and calibration tools.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #c65a23;
      --sidebar-width: 320px;
    }

    body {
      background: #fbf5ec;
    }

    .app-name-link img {
      max-width: 220px;
    }

    .sidebar {
      border-right: 1px solid rgba(198, 90, 35, 0.14);
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.03);
    }

    .sidebar ul li.active > a {
      font-weight: 700;
      color: #c65a23;
    }

    .sidebar-nav > ul > li {
      margin: 0.85rem 0 0.35rem;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 800;
      color: #3d2b22;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      letter-spacing: -0.01em;
    }

    .sidebar-nav > ul > li > ul {
      margin-top: 0.4rem;
      margin-left: 1rem;
      padding-left: 0.9rem;
      border-left: 2px solid rgba(198, 90, 35, 0.12);
    }

    .sidebar-nav > ul > li > ul > li {
      margin: 0.3rem 0;
    }

    .sidebar-nav > ul > li > ul > li > a {
      font-weight: 650;
      font-size: 0.96rem;
      color: #5c463b;
    }

    .sidebar-nav > ul > li > ul > li > ul {
      margin-top: 0.25rem;
      margin-left: 0.85rem;
      padding-left: 0.85rem;
      border-left: 1px solid rgba(198, 90, 35, 0.12);
    }

    .sidebar-nav > ul > li > ul > li > ul > li {
      margin: 0.22rem 0;
    }

    .sidebar-nav > ul > li > ul > li > ul > li > a {
      font-size: 0.88rem;
      font-weight: 500;
      color: #6e5a4d;
    }

    .markdown-section {
      max-width: 1100px;
      padding: 2rem 3rem 4rem;
      line-height: 1.75;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      font-size: 1.02rem;
      font-weight: 740;
      margin: 1.15rem 0 0.45rem 4.2rem;
      color: #3f5e79;
    }
    /* Keep all body content under a step visually grouped, not just the first sibling */
    .markdown-section h3 ~ p,
    .markdown-section h3 ~ ul,
    .markdown-section h3 ~ ol,
    .markdown-section h3 ~ div,
    .markdown-section h3 ~ table,
    .markdown-section h3 ~ blockquote {
      margin-left: 4.2rem;
      max-width: calc(100% - 4.2rem);
    }

    /* Stop the grouping when a new heading level begins */
    .markdown-section h3 ~ h1,
    .markdown-section h3 ~ h2,
    .markdown-section h3 ~ h3 {
      margin-left: 0;
      max-width: none;
    }

    /* Keep step images visually centered inside the indented content column */
    .markdown-section h3 ~ div[align="center"] {
      text-align: left;
    }

    .markdown-section h3 ~ div[align="center"] img {
      display: block;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .markdown-section h1 {
      font-size: 2.2rem;
      font-weight: 820;
      margin: 3rem 0 1.5rem;
    }

    .markdown-section h2 {
      display: block;
      font-size: 1.38rem;
      font-weight: 800;
      margin: 2.4rem 0 1rem 1.4rem;
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 5px solid rgba(198, 90, 35, 0.28);
      color: #24496a;
    }

    .markdown-section h3 {
      font-size: 1.02rem;
      font-weight: 740;
      margin: 1.15rem 0 0.45rem 4.2rem;
      color: #3f5e79;
    }
    /* Keep all body content under a step visually grouped, not just the first sibling */
    .markdown-section h3 ~ p,
    .markdown-section h3 ~ ul,
    .markdown-section h3 ~ ol,
    .markdown-section h3 ~ div,
    .markdown-section h3 ~ table,
    .markdown-section h3 ~ blockquote {
      margin-left: 4.2rem;
      max-width: calc(100% - 4.2rem);
    }

    /* Stop the grouping when a new heading level begins */
    .markdown-section h3 ~ h1,
    .markdown-section h3 ~ h2,
    .markdown-section h3 ~ h3 {
      margin-left: 0;
      max-width: none;
    }

    /* Keep step images visually centered inside the indented content column */
    .markdown-section h3 ~ div[align="center"] {
      text-align: left;
    }

    .markdown-section h3 ~ div[align="center"] img {
      display: block;
      margin-left: auto !important;
      margin-right: auto !important;
    }

    .markdown-section h2 + p,
    .markdown-section h2 + ul,
    .markdown-section h2 + ol,
    .markdown-section h2 + div,
    .markdown-section h2 + table,
    .markdown-section h2 + blockquote {
      margin-left: 2.4rem;
    }

    .markdown-section h3 + p,
    .markdown-section h3 + ul,
    .markdown-section h3 + ol,
    .markdown-section h3 + div,
    .markdown-section h3 + table,
    .markdown-section h3 + blockquote {
      margin-left: 4.2rem;
    }

    .markdown-section hr {
      margin: 1.35rem 0 1.35rem 1.4rem;
      max-width: calc(100% - 1.4rem);
      opacity: 0.45;
    }

    .markdown-section img {
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    .cover-main > p:last-child a:last-child,
    .cover-main > p:last-child a:first-child {
      border-radius: 999px;
    }

    .search {
      margin-bottom: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(198, 90, 35, 0.12);
    }

    @media (max-width: 768px) {
      .markdown-section {
        padding: 1.25rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'OuchiTaiko',
      repo: 'https://github.com/OuchiTaikoProject/OuchiTaikoProject',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      maxLevel: 3,
      homepage: 'README.md',
      search: {
        placeholder: 'Search guide',
        noData: 'No matches found',
        depth: 3
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
