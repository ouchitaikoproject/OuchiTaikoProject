<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OuchiTaiko</title>
  <meta name="description" content="OuchiTaiko build guide and calibration tools.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #c65a23;
      --sidebar-width: 320px;
    }

    body {
      background: linear-gradient(180deg, #fffaf5 0%, #fff 260px);
    }

    .app-name-link img {
      max-width: 220px;
    }

    .sidebar {
      border-right: 1px solid rgba(198, 90, 35, 0.14);
      box-shadow: 10px 0 35px rgba(0, 0, 0, 0.03);
    }

    .sidebar ul li.active > a {
      font-weight: 700;
      color: #c65a23;
    }

    .sidebar-nav > ul > li {
      margin: 0.85rem 0 0.35rem;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 800;
      color: #3d2b22;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
      letter-spacing: -0.01em;
    }

    .sidebar-nav > ul > li > ul {
      margin-top: 0.4rem;
      margin-left: 1rem;
      padding-left: 0.9rem;
      border-left: 2px solid rgba(198, 90, 35, 0.12);
    }

    .sidebar-nav > ul > li > ul > li {
      margin: 0.3rem 0;
    }

    .sidebar-nav > ul > li > ul > li > a {
      font-weight: 600;
      color: #5c463b;
    }

    .markdown-section {
      max-width: 1100px;
      padding: 2rem 3rem 4rem;
      line-height: 1.75;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      letter-spacing: -0.02em;
    }

    .markdown-section img {
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
    }

    .cover-main > p:last-child a:last-child,
    .cover-main > p:last-child a:first-child {
      border-radius: 999px;
    }

    .search {
      margin-bottom: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(198, 90, 35, 0.12);
    }

    @media (max-width: 768px) {
      .markdown-section {
        padding: 1.25rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'OuchiTaiko',
      repo: 'https://github.com/OuchiTaikoProject/OuchiTaikoProject',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      maxLevel: 3,
      homepage: 'README.md',
      search: {
        placeholder: 'Search guide',
        noData: 'No matches found',
        depth: 3
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
