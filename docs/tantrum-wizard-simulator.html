<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OuchiTaiko Tantrum Wizard Simulator</title>
  <style>
    body { font-family: Consolas, "Courier New", monospace; margin: 20px; background: #f5f7fa; color: #111; }
    .card { background: #fff; border: 1px solid #ccd3dd; border-radius: 8px; padding: 14px; max-width: 900px; }
    .row { margin: 8px 0; }
    .k { display: inline-block; min-width: 34px; text-align: center; border: 1px solid #8896aa; border-radius: 4px; padding: 2px 6px; background: #eef2f7; }
    .mono { white-space: pre-wrap; }
    button { margin-right: 8px; padding: 6px 10px; cursor: pointer; }
    .muted { color: #4e5a6a; }
    .ok { color: #0a6a2a; font-weight: bold; }
    .warn { color: #9a5a00; font-weight: bold; }
    .err { color: #9a0015; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Tantrum Wizard Simulator (No Hardware)</h2>
    <div class="row muted">
      Controls:
      <span class="k">A</span> confirm/advance when allowed,
      <span class="k">B</span> cancel,
      any printable key = drum hit during hit phases.
    </div>
    <div class="row">
      <button id="start">Start Simulation</button>
      <button id="tick">Advance Time +1s</button>
      <button id="forceError">Force Error Screen</button>
      <button id="reset">Reset</button>
    </div>
    <hr />
    <div class="row"><strong>Current Screen:</strong> <span id="screen"></span></div>
    <div class="row"><strong>Pad Order:</strong> <span id="padOrder"></span></div>
    <div class="row"><strong>Step Text:</strong></div>
    <div class="row mono" id="text"></div>
    <div class="row"><strong>Status:</strong> <span id="status"></span></div>
    <div class="row"><strong>Log:</strong></div>
    <div class="row mono" id="log"></div>
  </div>

  <script>
    const PADS = ["Ka Left", "Don Left", "Don Right", "Ka Right"];
    const screenEl = document.getElementById("screen");
    const textEl = document.getElementById("text");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const padOrderEl = document.getElementById("padOrder");

    let s;
    function resetState() {
      s = {
        mode: "idle",
        pad: 0,
        hits: 0,
        rapidStarted: false,
        rapidSeconds: 3,
        timedSeconds: 0,
        cancelled: false
      };
      render("Simulator reset.");
    }

    function appendLog(line) {
      const ts = new Date().toLocaleTimeString();
      logEl.textContent = `[${ts}] ${line}\n` + logEl.textContent;
    }

    function enter(mode) {
      s.mode = mode;
      s.hits = 0;
      s.timedSeconds = 0;
      if (mode !== "padRapid") {
        s.rapidStarted = false;
        s.rapidSeconds = 3;
      }
      render();
    }

    function currentPadName() {
      return PADS[s.pad] || "N/A";
    }

    function render(msg) {
      if (msg) appendLog(msg);
      padOrderEl.textContent = PADS.join(" -> ");
      screenEl.textContent = s.mode;

      let lines = [];
      let status = "";

      switch (s.mode) {
        case "idle":
          lines = [
            "Menu path:",
            "Main Menu -> Drum Tuning -> Auto Calibrate -> Start Wizard",
            "",
            "Press Start Simulation to enter Welcome."
          ];
          status = "Waiting to start.";
          break;
        case "welcome":
          lines = [
            "AUTO CALIBRATE",
            "Use one hand only.",
            "Never hit 2 pads.",
            "3 phases per pad: normal, strong, rapid",
            "A: Begin  B: Cancel"
          ];
          status = "A is allowed. B cancels.";
          break;
        case "padNormal":
          lines = [
            `${currentPadName()} (${s.pad + 1}/4)`,
            "NORMAL",
            "One hand - normal hit"
          ];
          status = `Hit count: ${s.hits}/3 (any key = hit). A ignored. B cancels.`;
          break;
        case "transitionStrong":
          lines = [
            "Phase Done!",
            "Starting next: Strong hits",
            `(${Math.max(0, 2 - s.timedSeconds)}s)...`
          ];
          status = "Timed transition. A ignored. B cancels.";
          break;
        case "padStrong":
          lines = [
            `${currentPadName()} (${s.pad + 1}/4)`,
            "STRONG",
            "One hand - hardest hit"
          ];
          status = `Hit count: ${s.hits}/3 (any key = hit). A ignored. B cancels.`;
          break;
        case "transitionRapid":
          lines = [
            "Phase Done!",
            "Starting next: Rapid hits",
            `(${Math.max(0, 2 - s.timedSeconds)}s)...`
          ];
          status = "Timed transition. A ignored. B cancels.";
          break;
        case "padRapid":
          lines = [
            `${currentPadName()} (${s.pad + 1}/4)`,
            "RAPID",
            s.rapidStarted ? "One hand - keep going!" : "One hand rapid - hit start"
          ];
          status = s.rapidStarted
            ? `Rapid timer: ${s.rapidSeconds}s remaining (press Advance Time). A ignored. B cancels.`
            : "Any key starts rapid timer. A ignored. B cancels.";
          break;
        case "padDone":
          lines = [
            `${currentPadName()}`,
            "Calibrated!",
            s.pad < 3 ? "Next pad loading..." : "Finalizing results..."
          ];
          status = "Timed step. A ignored. B cancels.";
          break;
        case "overview":
          lines = [
            "Review Results",
            "DonL: <value>  DonR: <value>",
            "KaL:  <value>  KaR:  <value>",
            "Auto-applying... B:Cancel"
          ];
          status = "Timed step. A ignored. B cancels.";
          break;
        case "saving":
          lines = [
            "Saving...",
            "Writing to flash"
          ];
          status = "Timed step.";
          break;
        case "complete":
          lines = [
            "DONE!",
            "Thresholds saved.",
            "Play mode resumed."
          ];
          status = "End of wizard.";
          break;
        case "error":
          lines = [
            "Redo Needed",
            "Example message: Need harder strong hits",
            "A:Retry  B:Cancel"
          ];
          status = "Only here A is valid for retry.";
          break;
        case "cancelled":
          lines = ["Wizard cancelled."];
          status = "Press Reset or Start Simulation.";
          break;
      }

      textEl.textContent = lines.join("\n");
      statusEl.textContent = status;
    }

    function advanceTime() {
      switch (s.mode) {
        case "transitionStrong":
        case "transitionRapid":
          s.timedSeconds++;
          if (s.timedSeconds >= 2) {
            enter(s.mode === "transitionStrong" ? "padStrong" : "padRapid");
          } else {
            render("Transition tick.");
          }
          break;
        case "padRapid":
          if (!s.rapidStarted) return;
          s.rapidSeconds--;
          if (s.rapidSeconds <= 0) {
            enter("padDone");
          } else {
            render("Rapid timer tick.");
          }
          break;
        case "padDone":
          s.timedSeconds++;
          if (s.timedSeconds >= 1) {
            if (s.pad < 3) {
              s.pad++;
              enter("padNormal");
            } else {
              enter("overview");
            }
          } else {
            render("Pad done tick.");
          }
          break;
        case "overview":
          s.timedSeconds++;
          if (s.timedSeconds >= 2) enter("saving");
          else render("Overview tick.");
          break;
        case "saving":
          s.timedSeconds++;
          if (s.timedSeconds >= 1) enter("complete");
          else render("Saving tick.");
          break;
        default:
          render("No timed action on this screen.");
          break;
      }
    }

    function handleA() {
      switch (s.mode) {
        case "welcome":
          enter("padNormal");
          appendLog("A accepted: begin wizard.");
          break;
        case "error":
          enter("padNormal");
          appendLog("A accepted: retry current pad from NORMAL.");
          break;
        default:
          appendLog("A ignored on this screen.");
          break;
      }
    }

    function handleB() {
      if (s.mode === "idle" || s.mode === "complete" || s.mode === "cancelled") {
        appendLog("B ignored on this screen.");
        return;
      }
      s.mode = "cancelled";
      render("B pressed: wizard cancelled.");
    }

    function handleHit() {
      if (s.mode === "padNormal" || s.mode === "padStrong") {
        s.hits++;
        if (s.hits >= 3) {
          enter(s.mode === "padNormal" ? "transitionStrong" : "transitionRapid");
        } else {
          render("Hit registered.");
        }
        return;
      }
      if (s.mode === "padRapid") {
        if (!s.rapidStarted) {
          s.rapidStarted = true;
          appendLog("Rapid started by first hit.");
        } else {
          appendLog("Rapid hit registered.");
        }
        render();
        return;
      }
      appendLog("Hit ignored on this screen.");
    }

    document.getElementById("start").addEventListener("click", () => {
      if (s.mode === "idle" || s.mode === "cancelled" || s.mode === "complete") {
        s.pad = 0;
        enter("welcome");
      } else {
        appendLog("Already running.");
      }
    });
    document.getElementById("tick").addEventListener("click", advanceTime);
    document.getElementById("forceError").addEventListener("click", () => enter("error"));
    document.getElementById("reset").addEventListener("click", resetState);

    document.addEventListener("keydown", (e) => {
      if (e.key === "a" || e.key === "A") return handleA();
      if (e.key === "b" || e.key === "B") return handleB();
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return handleHit();
    });

    resetState();
  </script>
</body>
</html>
