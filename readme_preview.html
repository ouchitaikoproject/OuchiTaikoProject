<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>README Preview</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --panel: rgba(255,255,255,0.95);
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --shadow: 0 8px 30px rgba(31,35,40,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .shell {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .toolbar {
      position: sticky;
      top: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: #f6f8fa;
      color: var(--text);
      border-radius: 8px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .frame {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: white;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .markdown-body {
      max-width: none;
      padding: 32px 40px 48px;
    }
    .error {
      margin: 24px;
      border: 1px solid #d1242f33;
      background: #ffebe9;
      color: #cf222e;
      border-radius: 12px;
      padding: 14px 16px;
      white-space: pre-wrap;
    }
    @media (max-width: 800px) {
      .toolbar {
        position: static;
        align-items: flex-start;
        flex-direction: column;
      }
      .markdown-body {
        padding: 24px 18px 36px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="toolbar">
      <div>
        <div class="title">README.md Preview</div>
        <div class="status" id="status">Loading README...</div>
      </div>
      <div class="actions">
        <button id="refreshBtn" type="button">Refresh now</button>
        <div class="hint">Watching for changes</div>
      </div>
    </div>
    <div class="frame">
      <article id="content" class="markdown-body"></article>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const refreshBtn = document.getElementById('refreshBtn');

    let lastRaw = null;
    let inFlight = false;

    marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });

    function stamp(text) {
      statusEl.textContent = `${text} Last checked ${new Date().toLocaleTimeString()}`;
    }

    async function loadReadme(force = false) {
      if (inFlight) return;
      inFlight = true;
      refreshBtn.disabled = true;
      try {
        const res = await fetch(`README.md?ts=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status} while loading README.md`);
        const raw = await res.text();
        if (force || raw !== lastRaw) {
          lastRaw = raw;
          contentEl.innerHTML = marked.parse(raw);
          stamp('Watching for changes.');
        } else {
          stamp('No changes detected.');
        }
      } catch (err) {
        contentEl.innerHTML = `<div class="error">Could not load README preview.\n\n${err.message}</div>`;
        stamp('Preview error.');
      } finally {
        inFlight = false;
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', () => loadReadme(true));
    loadReadme(true);
    setInterval(() => loadReadme(false), 2500);
  </script>
</body>
</html>
