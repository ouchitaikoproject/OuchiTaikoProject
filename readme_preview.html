<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css">
  <style>
    body {
      margin: 0;
      background: #f6f8fa;
      color: #24292f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .frame {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 16px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(31, 35, 40, 0.06);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .toolbar p {
      margin: 0;
      color: #57606a;
      font-size: 0.92rem;
    }

    .toolbar button {
      border: 1px solid #d0d7de;
      border-radius: 8px;
      background: #f6f8fa;
      color: #24292f;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #eef2f6;
    }

    .markdown-body {
      box-sizing: border-box;
      min-height: 100vh;
      padding: 32px 40px;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 8px 28px rgba(31, 35, 40, 0.06);
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 800px) {
      .frame {
        padding: 12px;
      }

      .markdown-body {
        padding: 20px 18px;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="toolbar">
      <div>
        <h1>README.md Preview</h1>
        <p id="status">Loading…</p>
      </div>
      <button id="refresh" type="button">Refresh now</button>
    </div>
    <article id="preview" class="markdown-body"></article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const refreshButton = document.getElementById('refresh');
    let lastContent = '';

    function slugifyHeading(text) {
      return text
        .toLowerCase()
        .replace(/<[^>]+>/g, '')
        .replace(/[??]/g, '')
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function scrollToHash(hash = location.hash) {
      if (!hash) return;
      const id = decodeURIComponent(hash.replace(/^#/, ''));
      const target = document.getElementById(id);
      if (target) {
        target.scrollIntoView({ behavior: 'auto', block: 'start' });
      }
    }

    const renderer = new marked.Renderer();
    renderer.heading = function ({ tokens, depth }) {
      const text = this.parser.parseInline(tokens);
      const id = slugifyHeading(text);
      return `<h${depth} id="${id}">${text}</h${depth}>`;
    };

    async function loadReadme(force = false) {
      try {
        const response = await fetch(`README.md?ts=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();
        if (!force && markdown === lastContent) {
          status.textContent = `Watching for changes. Last checked ${new Date().toLocaleTimeString()}`;
          return;
        }

        lastContent = markdown;
        preview.innerHTML = marked.parse(markdown, {
          gfm: true,
          breaks: false,
          mangle: false,
          renderer
        });
        scrollToHash();
        status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        status.textContent = `Preview error: ${error.message}`;
      }
    }

    window.addEventListener('hashchange', scrollToHash);
    preview.addEventListener('click', (event) => {
      const link = event.target.closest('a');
      if (!link) return;

      const href = link.getAttribute('href') || '';
      if (!href.startsWith('#')) return;

      event.preventDefault();
      history.replaceState(null, '', href);
      scrollToHash(href);
    });

    refreshButton.addEventListener('click', () => loadReadme(true));

    loadReadme(true);
    setInterval(loadReadme, 1500);
  </script>
</body>
</html>
